# 테스트 → 빌드 → GitHub Pages 배포
#
# main에 push하면 전부 실행되고, Pull Request에서는 테스트와 빌드까지만 한다.
# 시나리오 자동 검증 테스트가 여기서 돌기 때문에,
# "풀 수 없는 시나리오"가 들어오면 배포가 막힌다.

name: test-build-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # GitHub 화면에서 수동으로도 돌릴 수 있게

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 진행한다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 테스트와 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json 그대로 설치한다 (npm install과 달리 버전이 바뀌지 않는다)
      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      # main 브랜치일 때만 배포용 결과물을 올린다
      - name: 빌드 결과물 업로드
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: GitHub Pages 배포
    needs: test # 테스트가 통과해야만 배포한다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
