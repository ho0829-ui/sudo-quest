<text x="80" y="548" fill="#6df4a0" font-size="18" font-weight="700" font-family="Pretendard,Noto Sans KR,Apple SD Gothic Neo,sans-serif">공급자 · 모델 · 청크 설정 · 차원이 달라지면 기존 색인을 재사용하지 않음</text>
